apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.wharfssh'
version = '0.1.0'

android {
  namespace "expo.modules.wharfssh"
  defaultConfig {
    // expo-module-gradle-plugin builds a 'release' publishing component and
    // requires both to be set, even for a local (never-published) module.
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 24
  }
}

// --- gomobile engine binding ------------------------------------------------
// The engine aar is deliberately NOT committed: gomobile output is not
// reproducible, so a checked-in binary churns ~16 MB on every unrelated rebuild
// and cannot be merged. Instead it is built from sshengine/*.go on demand, here,
// so an Android build never fails on a missing artifact. Requires Go + an NDK;
// on EAS the NDK ships with the image and Go is installed by the
// eas-build-pre-install hook (scripts/eas-pre-install.sh).
def repoRoot = projectDir.toPath().resolve("../../..").normalize().toFile()
def engineAar = file("libs/sshengine.aar")
def engineSources = fileTree(dir: new File(repoRoot, "sshengine"), include: "**/*.go")

tasks.register("buildSshEngine", Exec) {
  description = "Builds sshengine.aar with gomobile when missing or older than the Go sources."
  group = "build"
  workingDir repoRoot
  commandLine "./scripts/build-ssh-engine.sh", "--android"

  // Staleness is decided explicitly rather than via Gradle's output snapshotting:
  // the binding is non-deterministic, so hashing the aar would force a rebuild
  // every time it was regenerated out-of-band.
  onlyIf {
    !engineAar.exists() ||
      engineSources.files.any { it.lastModified() > engineAar.lastModified() }
  }
  inputs.files(engineSources).withPropertyName("engineSources")
}

tasks.named("preBuild").configure {
  dependsOn("buildSshEngine")
}

dependencies {
  // The gomobile-compiled engine (package `sshengine`, class `Sshengine`),
  // regenerated by the buildSshEngine task above and rsynced into libs/.
  // iOS ships its own committed xcframework instead.
  implementation files("libs/sshengine.aar") {
    builtBy("buildSshEngine")
  }
}
